<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- social:start (each post's page gets its own copy of this block at build time; see vite.config.js) -->
  <title>Past The Eye Test | Baseball Analytics</title>
  <meta name="description" content="MLB and NHL player cards, pitch modeling, leaderboards, and articles." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Past The Eye Test" />
  <meta property="og:title" content="Past The Eye Test" />
  <meta property="og:description" content="MLB and NHL player cards, pitch modeling, leaderboards, and articles." />
  <meta property="og:url" content="https://www.pasttheeyetest.com/" />
  <meta property="og:image" content="https://www.pasttheeyetest.com/logo.jpg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@pasttheeyetest" />
  <!-- social:end -->
  <link rel="icon" href="/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Pliant:wght@100..900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* No mobile text inflation: phones otherwise enlarge long paragraphs inside the
       scaled-down cards (and in the PNG export's cloned copy of the page). */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f1a;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3b82f6 0%, #f59e0b 100%); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #2563eb 0%, #ea580c 100%); }
    select, input, button { font-family: inherit; }
    ::selection { background: rgba(245, 158, 11, 0.3); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
