name: Score Pitches

on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC = 7:00 AM ET, after update-data.yml
  workflow_dispatch:

concurrency:
  group: score-pitches
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pybaseball pandas numpy lightgbm pyarrow requests

      - name: Fetch full-season Statcast parquet
        run: |
          mkdir -p tmp
          python3 fetch_statcast.py --year 2026 --out tmp/pitch_xrv_2026.parquet

      - name: Build pitcher height cache
        run: |
          python3 build_pitcher_heights.py \
            --parquet tmp/pitch_xrv_2026.parquet \
            --sport-ids 1 11 51 \
            --out models/pitcher_heights.json

      - name: Score pitches with 3-stage model
        run: |
          python3 score_pitches.py \
            --input tmp/pitch_xrv_2026.parquet \
            --models models \
            --config models/final_model_config.json \
            --output-dir tmp/output

      - name: Build Pitch+ JSON for the React app
        run: |
          python3 build_pitch_plus.py \
            --season-dir tmp/output/season \
            --year 2026 \
            --out public/pitch_plus_2026.json

      - name: Build Team+ JSON for team plots
        run: |
          python3 build_team_plus.py \
            --year 2026 \
            --parquet tmp/pitch_xrv_2026.parquet

      - name: Commit Pitch+ and Team+ data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pitch_plus_*.json public/team_plus_*.json models/pitcher_heights.json
          git diff --staged --quiet || git commit -m "Auto-update Pitch+ $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
